<!DOCTYPE html>
<html>
<head>
    <meta charset="Shift_JIS">
    <meta http-equiv="x-ua-compatible" content="IE=Edge">
    <title>WAFCA game</title>
    <style type="text/css">
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #000; 
            font-family: 'MS Gothic', sans-serif;
            
            /* ��ʑS�̂ɍL���A���g�𒆉��ɔz�u */
            display: grid;
            place-items: center;
            height: 95vh;
            width: 110vw;
            overflow: hidden; /* �X�N���[���o�[���B�� */
        }
        #wrapper {
            /* ��ƂȂ�T�C�Y (�����L���O200px + �]��20px + �Q�[��320px) */
            width: 540px; 
            height: 240px; /* �Q�[���̍����ɍ��킹�� */
            
            /* ���g�������т� */
            display: flex;
            
            /* JavaScript�Ŋg��k�������邽�߂̐ݒ� */
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        /* �����L���O�{�[�h */
        #ranking-board {
            width: 200px;
            color: white;
            order: 1; /* 1�Ԗ� */
            height: 100%;
            box-sizing: border-box;
        }
        #ranking-board h3 {
            color: yellow;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
            border-bottom: 1px solid yellow;
            padding-bottom: 5px;
        }
        #ranking-list {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
            font-size: 14px;
        }
        #ranking-list li {
            display: flex;
            justify-content: space-between;
            padding: 4px 5px;
            border-bottom: 1px dotted #555;
        }
        #ranking-list li .name {
            width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #ranking-list li .score {
            color: yellow;
            text-align: right;
        }

        /* �Q�[����� (iframe) */
        #game-frame {
            width: 320px;
            height: 240px;
            border: none;
            order: 2; /* 2�Ԗ� */
            margin-left: 20px;
        }
    </style>
</head>
<body>
    
    <div id="wrapper">
    
        <div id="ranking-board">
            <h3>RANKING - TOP 10</h3>
            <ol id="ranking-list">
                <li>Loading...</li>
            </ol>
        </div>

        <iframe id="game-frame" src="game.html" onload="this.contentWindow.focus()"></iframe>

    </div> 

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        function resizeGame() {
            var wrapper = document.getElementById('wrapper');
            
            // ��ƂȂ�T�C�Y (CSS�Őݒ肵�����̂Ɠ���)
            var baseWidth = 540;
            var baseHeight = 240;
            
            // ���݂̃E�B���h�E�T�C�Y
            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;
            
            // ���ƍ����̊g�嗦���v�Z
            var scaleX = windowWidth / baseWidth;
            var scaleY = windowHeight / baseHeight;
            
            // �A�X�y�N�g����ێ����邽�߁A���������̊g�嗦���̗p
            var scale = Math.min(scaleX, scaleY);
            
            // �g�嗦��CSS��transform�ɓK�p
            wrapper.style.transform = 'scale(' + scale + ')';
        }

        // �E�B���h�E�T�C�Y���ς�������ƁA
        window.addEventListener('resize', resizeGame);
        // �y�[�W�ǂݍ��݂������������ɁA�T�C�Y�v�Z�����s
        window.addEventListener('load', resizeGame);
        // XSS�΍��p��HTML�G�X�P�[�v�֐�
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, function(match) {
                return {
                    '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;', "'": '&#39;'
                }[match];
            });
        }

        // Firebase�ݒ�
        const firebaseConfig = {
            apiKey: "AIzaSyBcB9nl0Gc-uBU3qv3S8tdkeCNaOiOuGZQ",
            authDomain: "rinti-game.firebaseapp.com",
            projectId: "rinti-game",
            storageBucket: "rinti-game.appspot.com",
            messagingSenderId: "772577048333",
            appId: "1:772577048333:web:cf8f76cb07a3ddea18a244",
        };

        var db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            db.settings({ persistence: false }); // �����΍�
            setupRankingListener(); // �����L���O�Ď����J�n
        } catch (e) {
            console.error("Firebase�̏������Ɏ��s���܂���:", e);
        }

        // �����L���O�{�[�h�����A���^�C���ōX�V
        function setupRankingListener() {
            var rankingListElement = document.getElementById("ranking-list");
            if (!db) {
                rankingListElement.innerHTML = "<li>DB Error</li>";
                return;
            }

            db.collection("scores").orderBy("score", "desc").limit(10)
              .onSnapshot(function(querySnapshot) {
                  rankingListElement.innerHTML = ""; // ���X�g����ɂ���
                  var rank = 1;
                  if (querySnapshot.empty) {
                      rankingListElement.innerHTML = "<li>�܂��X�R�A������܂���</li>";
                      return;
                  }
                  querySnapshot.forEach(function(doc) {
                      var data = doc.data();
                      var name = escapeHTML(data.name || "NO NAME");
                      var score = data.score || 0;
                      var listItem = document.createElement("li");
                      listItem.innerHTML = 
                          '<span class="name">' + rank + '. ' + name + '</span>' +
                          '<span class="score">' + score + '</span>';
                      rankingListElement.appendChild(listItem);
                      rank++;
                  });
              }, function(error) {
                  console.error("�����L���O�̎擾�Ɏ��s: ", error);
                  rankingListElement.innerHTML = "<li>�ǂݍ��݂Ɏ��s</li>";
              });
        }

        // ������ �Q�[��(iframe)����X�R�A���󂯎�郊�X�i�[ ������
        window.addEventListener("message", function(event) {
            // event.data �� { type: 'saveScore', name: 'PLAYER', score: 500, time: 30 } �̂悤�ȃf�[�^�������Ă���
            if (event.data && event.data.type === 'saveScore') {
                if (db) {
                    db.collection("scores").add({
                        name: event.data.name.substring(0, 10),
                        score: event.data.score,
                        time: event.data.time,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp() // v8�̏�����
                    })
                    .then(function() {
                        console.log("�X�R�A��ۑ����܂����B");
                    })
                    .catch(function(error) {
                        console.error("�X�R�A�̕ۑ��Ɏ��s: ", error);
                    });
                }
            }
        }, false);
    </script>
</body>
</html>
